<!doctype html><html><head><meta charset="utf-8"><base href="file:///A:/risk_server/project/safety_manual/"><link rel="stylesheet" href="assets/manual-form-preview.css"></head><body data-manual-year="2026"><a href="policy_review.php?preview=1" data-manual-form="review">양식1) 안전보건방침 및 목표 검토 결과</a><a href="goal_plan.php?preview=1" data-manual-form="plan">양식2)안전보건 목표 및 추진계획</a><script src="assets/manual-form-preview.js"></script><script>window.addEventListener('load',()=>{let count=0;for(const kind of ['review','plan']){document.querySelector('[data-manual-form="'+kind+'"]').click();const d=document.getElementById('manual-form-dialog');if(!d.open)throw Error('modal');for(const mode of ['blank','current','year']){const m=document.getElementById('manual-form-mode');m.value=mode;m.dispatchEvent(new Event('change'));document.getElementById('manual-form-year').value='2025';document.getElementById('manual-form-select').dispatchEvent(new Event('submit',{cancelable:true}));const url=new URL(document.getElementById('manual-form-frame').src);if(url.searchParams.get('year')!==(mode==='year'?'2025':'2026'))throw Error('year');if(url.searchParams.has('blank')!==(mode==='blank'))throw Error('blank');if(!url.pathname.endsWith(kind==='review'?'policy_review.php':'goal_plan.php'))throw Error('route');count++;}d.close();}document.body.dataset.test='passed-'+count;});</script></body></html>
